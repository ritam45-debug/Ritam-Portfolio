# Builds the site on every push to main (and every 3 hours for fresh news) and publishes it to the gh-pages branch.
# GitHub Pages serves the gh-pages branch at https://<user>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # refresh the news section every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect latest news headlines
        run: node scripts/fetch-news.mjs || echo "News fetch failed; keeping the previous file"
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: touch dist/.nojekyll && cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
